name: LK Online APK Builder

'on':
push:
branches: [main]
workflow_dispatch:

jobs:
android-build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install Dependencies
    run: npm install --legacy-peer-deps

  - name: Build Web
    run: npm run build

  - name: Install Capacitor
    run: npm install @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps

  - name: Add Android
    run: npx cap add android

  - name: Sync Android
    run: npx cap sync android

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LK-Online-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
